# Project configuration - used for Gradle and scripts of build
# Project configuration - usado por Gradle e scripts de build
appName=scene2d-ui-builder
# Nome de exibição do app (Start menu, título de janela do instalador, nome do
# pacote final) ? diferente de appName, que é o nome do artefato/JAR do Gradle.
appDisplayName=Scene2d UI Builder
# appVersion = versão base (3 algarismos, x.x.x) ? só muda em release nova.
# appPatch   = contador de patch dessa versão base (0 = nenhum patch ainda).
# Versão final em runtime = appVersion, ou "appVersion.appPatch" se appPatch > 0.
# Use scripts/bump_version.py pra incrementar/zerar em vez de editar à mão.
appVersion=1.0.0
appPatch=2
appVendor=Eliezer Dev Software Enginner
appCopyright=Copyright 2026
appDescription=Scene2d UI builder. Now you can create your huds and menus for libgdx games whithout fighting with Tables manually.
appMainClass=my_app.Main
# Categoria do menu de aplicativos no Linux (--linux-menu-group do jpackage)
appLinuxMenuGroup=Tools